name: Deploy Python WebApp to AWS Kubeadm Kubernetes

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build:

    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.export-image.outputs.image }}

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Login to Docker Hub
      # ----------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------
      - name: Build Docker image
        run: |
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/python-webapp"

          echo "======================================"
          echo "Building Docker Image"
          echo "======================================"
          echo "Image: $IMAGE"
          echo "SHA:   ${{ github.sha }}"

          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .

      # ----------------------------------------------------------
      # Push Docker image to Docker Hub
      # ----------------------------------------------------------
      - name: Push Docker image
        run: |
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/python-webapp"

          echo "======================================"
          echo "Pushing Docker Image"
          echo "======================================"

          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

          echo "Docker image pushed successfully."

      # ----------------------------------------------------------
      # Export image name for deployment job
      # ----------------------------------------------------------
      - name: Export image
        id: export-image
        run: |
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/python-webapp"

          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Image:"
          echo "$IMAGE:${{ github.sha }}"
          echo "======================================"


  # ============================================================
  # DEPLOY TO AWS KUBEADM KUBERNETES
  # ============================================================
  deploy:

    name: Deploy to AWS Kubeadm Kubernetes

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Install kubectl
      # ----------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # ----------------------------------------------------------
      # Verify kubectl installation
      # ----------------------------------------------------------
      - name: Check kubectl
        run: |
          kubectl version --client

      # ----------------------------------------------------------
      # Configure kubeconfig
      # ----------------------------------------------------------
      - name: Configure Kubernetes kubeconfig
        run: |
          echo "======================================"
          echo "Configuring Kubernetes kubeconfig"
          echo "======================================"

          mkdir -p "$HOME/.kube"

          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          echo "Kubeconfig configured successfully."

      # ----------------------------------------------------------
      # Test Kubernetes connection
      # ----------------------------------------------------------
      - name: Test Kubernetes connection
        run: |
          echo "======================================"
          echo "Kubernetes Cluster Information"
          echo "======================================"

          kubectl cluster-info

          echo ""
          echo "======================================"
          echo "Kubernetes Nodes"
          echo "======================================"

          kubectl get nodes -o wide

      # ----------------------------------------------------------
      # Apply Deployment
      # ----------------------------------------------------------
      - name: Apply Kubernetes Deployment
        run: |
          echo "======================================"
          echo "Applying Kubernetes Deployment"
          echo "======================================"

          kubectl apply \
            -f k8s/deployment.yaml \
            -n default

      # ----------------------------------------------------------
      # Apply Service
      # ----------------------------------------------------------
      - name: Apply Kubernetes Service
        run: |
          echo "======================================"
          echo "Applying Kubernetes Service"
          echo "======================================"

          kubectl apply \
            -f k8s/service.yaml \
            -n default

      # ----------------------------------------------------------
      # Update Deployment Image
      # ----------------------------------------------------------
      - name: Update Docker image
        env:
          IMAGE: ${{ needs.build.outputs.image }}

        run: |
          echo "======================================"
          echo "Updating Kubernetes Deployment"
          echo "======================================"

          echo "Deployment: python-app"
          echo "Container:  python-app"
          echo "Image:      $IMAGE"

          kubectl set image \
            deployment/python-app \
            python-app="$IMAGE" \
            -n default

      # ----------------------------------------------------------
      # Display deployment image
      # ----------------------------------------------------------
      - name: Verify deployment image
        run: |
          echo "======================================"
          echo "Current Deployment Image"
          echo "======================================"

          kubectl get deployment python-app \
            -n default \
            -o jsonpath='{.spec.template.spec.containers[*].image}'

          echo ""

      # ----------------------------------------------------------
      # Wait for rollout
      # ----------------------------------------------------------
      - name: Wait for Kubernetes rollout
        run: |
          echo "======================================"
          echo "Waiting for Kubernetes Rollout"
          echo "======================================"

          kubectl rollout status \
            deployment/python-app \
            -n default \
            --timeout=300s

      # ----------------------------------------------------------
      # Verify Pods
      # ----------------------------------------------------------
      - name: Verify Kubernetes Pods
        run: |
          echo "======================================"
          echo "Kubernetes Pods"
          echo "======================================"

          kubectl get pods \
            -n default \
            -o wide

      # ----------------------------------------------------------
      # Verify Deployment
      # ----------------------------------------------------------
      - name: Verify Kubernetes Deployment
        run: |
          echo "======================================"
          echo "Kubernetes Deployment"
          echo "======================================"

          kubectl get deployment python-app \
            -n default

      # ----------------------------------------------------------
      # Verify Service
      # ----------------------------------------------------------
      - name: Verify Kubernetes Service
        run: |
          echo "======================================"
          echo "Kubernetes Service"
          echo "======================================"

          kubectl get svc \
            -n default

      # ----------------------------------------------------------
      # Show final deployed image
      # ----------------------------------------------------------
      - name: Show deployed image
        run: |
          echo "======================================"
          echo "FINAL DEPLOYED IMAGE"
          echo "======================================"

          kubectl get deployment python-app \
            -n default \
            -o jsonpath='{.spec.template.spec.containers[*].image}'

          echo ""

          echo "======================================"
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "======================================"

name: Build and Deploy Python App

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/python-webapp

jobs:

  # ============================================================
  # JOB 1 - BUILD AND PUSH IMAGE TO DOCKER HUB
  # ============================================================

  build:

    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.set-image.outputs.image }}

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Validate Docker Hub configuration
      # ----------------------------------------------------------

      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e

          echo "Checking Docker Hub configuration..."

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME GitHub Secret is empty or missing."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN GitHub Secret is empty or missing."
            exit 1
          fi

          echo "Docker Hub username is configured."
          echo "Docker Hub token is configured."


      # ----------------------------------------------------------
      # Login to Docker Hub
      # ----------------------------------------------------------

      - name: Login to Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e

          echo "Logging in to Docker Hub..."

          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

          echo "Docker Hub login successful."


      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------

      - name: Build Docker image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e

          IMAGE="docker.io/${DOCKERHUB_USERNAME}/python-webapp"
          TAG="${GITHUB_SHA}"

          echo "=========================================="
          echo "Building Docker Image"
          echo "=========================================="
          echo "Image: $IMAGE"
          echo "Tag:   $TAG"
          echo "=========================================="

          docker build \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            .

          echo "Docker image built successfully."


      # ----------------------------------------------------------
      # Push Docker image to Docker Hub
      # ----------------------------------------------------------

      - name: Push Docker image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e

          IMAGE="docker.io/${DOCKERHUB_USERNAME}/python-webapp"
          TAG="${GITHUB_SHA}"

          echo "=========================================="
          echo "Pushing Docker Image"
          echo "=========================================="

          docker push "$IMAGE:$TAG"

          docker push "$IMAGE:latest"

          echo "Docker images pushed successfully."


      # ----------------------------------------------------------
      # Set image output
      # ----------------------------------------------------------

      - name: Set image output
        id: set-image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/python-webapp"

          echo "image=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Image for Kubernetes deployment:"
          echo "$IMAGE:${GITHUB_SHA}"
          echo "=========================================="


  # ============================================================
  # JOB 2 - DEPLOY TO AWS KUBEADM KUBERNETES
  # ============================================================

  deploy:

    name: Deploy to AWS Kubeadm Kubernetes

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Install kubectl
      # ----------------------------------------------------------

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest


      # ----------------------------------------------------------
      # Verify kubectl
      # ----------------------------------------------------------

      - name: Verify kubectl
        run: |
          kubectl version --client


      # ----------------------------------------------------------
      # Configure Kubernetes kubeconfig
      # ----------------------------------------------------------

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -e

          echo "=========================================="
          echo "Configuring Kubernetes kubeconfig"
          echo "=========================================="

          if [ -z "$KUBE_CONFIG" ]; then
            echo "ERROR: KUBE_CONFIG GitHub Secret is empty or missing."
            exit 1
          fi

          mkdir -p "$HOME/.kube"

          echo "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          echo "Kubeconfig created successfully."


      # ----------------------------------------------------------
      # Test Kubernetes connection
      # ----------------------------------------------------------

      - name: Test Kubernetes connection
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Testing Kubernetes API"
          echo "=========================================="

          kubectl cluster-info

          echo ""
          echo "=========================================="
          echo "Kubernetes Nodes"
          echo "=========================================="

          kubectl get nodes -o wide


      # ----------------------------------------------------------
      # Apply Deployment
      # ----------------------------------------------------------

      - name: Apply Kubernetes Deployment
        run: |
          echo "Applying Kubernetes Deployment..."

          kubectl apply \
            -f k8s/deployment.yaml \
            -n default


      # ----------------------------------------------------------
      # Apply Service
      # ----------------------------------------------------------

      - name: Apply Kubernetes Service
        run: |
          echo "Applying Kubernetes Service..."

          kubectl apply \
            -f k8s/service.yaml \
            -n default


      # ----------------------------------------------------------
      # Update Docker image
      # ----------------------------------------------------------

      - name: Update Kubernetes image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          echo "=========================================="
          echo "Updating Kubernetes Deployment"
          echo "=========================================="

          echo "Deployment : python-app"
          echo "Container  : python-app"
          echo "Image      : $IMAGE"

          kubectl set image \
            deployment/python-app \
            python-app="$IMAGE" \
            -n default


      # ----------------------------------------------------------
      # Verify image
      # ----------------------------------------------------------

      - name: Verify deployment image
        run: |
          echo "=========================================="
          echo "Deployment Image"
          echo "=========================================="

          kubectl get deployment python-app \
            -n default \
            -o jsonpath='{.spec.template.spec.containers[*].image}'

          echo ""


      # ----------------------------------------------------------
      # Wait for rollout
      # ----------------------------------------------------------

      - name: Wait for rollout
        run: |
          echo "=========================================="
          echo "Waiting for rollout"
          echo "=========================================="

          kubectl rollout status \
            deployment/python-app \
            -n default \
            --timeout=300s


      # ----------------------------------------------------------
      # Verify pods
      # ----------------------------------------------------------

      - name: Verify pods
        run: |
          echo "=========================================="
          echo "Kubernetes Pods"
          echo "=========================================="

          kubectl get pods \
            -n default \
            -o wide


      # ----------------------------------------------------------
      # Verify deployment
      # ----------------------------------------------------------

      - name: Verify deployment
        run: |
          echo "=========================================="
          echo "Kubernetes Deployment"
          echo "=========================================="

          kubectl get deployment python-app \
            -n default


      # ----------------------------------------------------------
      # Verify service
      # ----------------------------------------------------------

      - name: Verify service
        run: |
          echo "=========================================="
          echo "Kubernetes Service"
          echo "=========================================="

          kubectl get service \
            -n default


      # ----------------------------------------------------------
      # Final deployment information
      # ----------------------------------------------------------

      - name: Deployment summary
        run: |
          echo ""
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "Deployment:"
          kubectl get deployment python-app -n default

          echo ""
          echo "Pods:"
          kubectl get pods -n default

          echo ""
          echo "Service:"
          kubectl get service -n default

          echo ""
          echo "Image:"
          kubectl get deployment python-app \
            -n default \
            -o jsonpath='{.spec.template.spec.containers[*].image}'

          echo ""
          echo "=========================================="

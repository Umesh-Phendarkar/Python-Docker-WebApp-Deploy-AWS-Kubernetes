name: Build and Deploy Python App

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  build:

    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.set-image.outputs.image }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Validate Docker Hub credentials
      # ----------------------------------------------------------

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is missing."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN is missing."
            exit 1
          fi

          echo "Docker Hub credentials are configured."

      # ----------------------------------------------------------
      # Docker Hub login
      # ----------------------------------------------------------

      - name: Login to Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e

          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

          echo "Docker Hub login successful."

      # ----------------------------------------------------------
      # Build image
      # ----------------------------------------------------------

      - name: Build Docker image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e

          IMAGE="docker.io/${DOCKERHUB_USERNAME}/python-webapp"

          echo "Building:"
          echo "$IMAGE:${GITHUB_SHA}"

          docker build \
            -t "$IMAGE:${GITHUB_SHA}" \
            -t "$IMAGE:latest" \
            .

      # ----------------------------------------------------------
      # Push image
      # ----------------------------------------------------------

      - name: Push Docker image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e

          IMAGE="docker.io/${DOCKERHUB_USERNAME}/python-webapp"

          docker push "$IMAGE:${GITHUB_SHA}"

          docker push "$IMAGE:latest"

          echo "Docker images pushed successfully."

      # ----------------------------------------------------------
      # Export image
      # ----------------------------------------------------------

      - name: Set image output
        id: set-image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/python-webapp"

          echo "image=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"


  # ============================================================
  # DEPLOY TO KUBEADM KUBERNETES
  # ============================================================

  deploy:

    name: Deploy to AWS Kubeadm Kubernetes

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Install kubectl
      # ----------------------------------------------------------

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Verify kubectl
        run: |
          kubectl version --client

      # ----------------------------------------------------------
      # Configure RAW kubeconfig
      #
      # IMPORTANT:
      # KUBE_CONFIG secret must contain the actual kubeconfig YAML.
      # It must NOT be Base64 encoded.
      # ----------------------------------------------------------

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -e

          echo "=========================================="
          echo "Configuring Kubernetes kubeconfig"
          echo "=========================================="

          if [ -z "$KUBE_CONFIG" ]; then
            echo "ERROR: KUBE_CONFIG secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.kube"

          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          echo "Kubeconfig file created."

          echo "Validating kubeconfig..."

          kubectl config view --minify >/dev/null

          echo "Kubeconfig format is valid."

      # ----------------------------------------------------------
      # Test Kubernetes connection
      # ----------------------------------------------------------

      - name: Test Kubernetes connection
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Testing Kubernetes API"
          echo "=========================================="

          kubectl cluster-info

          echo ""
          echo "=========================================="
          echo "Kubernetes Nodes"
          echo "=========================================="

          kubectl get nodes -o wide

      # ----------------------------------------------------------
      # Apply Deployment
      # ----------------------------------------------------------

      - name: Apply Kubernetes Deployment
        run: |
          kubectl apply \
            -f k8s/deployment.yaml \
            -n default

      # ----------------------------------------------------------
      # Apply Service
      # ----------------------------------------------------------

      - name: Apply Kubernetes Service
        run: |
          kubectl apply \
            -f k8s/service.yaml \
            -n default

      # ----------------------------------------------------------
      # Update image
      # ----------------------------------------------------------

      - name: Update Kubernetes image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -e

          echo "=========================================="
          echo "Deploying Docker Image"
          echo "=========================================="

          echo "$IMAGE"

          kubectl set image \
            deployment/python-app \
            python-app="$IMAGE" \
            -n default

      # ----------------------------------------------------------
      # Show image
      # ----------------------------------------------------------

      - name: Verify deployment image
        run: |
          kubectl get deployment python-app \
            -n default \
            -o jsonpath='{.spec.template.spec.containers[*].image'

          echo ""

      # ----------------------------------------------------------
      # Wait for rollout
      # ----------------------------------------------------------

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/python-app \
            -n default \
            --timeout=300s

      # ----------------------------------------------------------
      # Verify pods
      # ----------------------------------------------------------

      - name: Verify pods
        run: |
          echo "=========================================="
          echo "PODS"
          echo "=========================================="

          kubectl get pods \
            -n default \
            -o wide

      # ----------------------------------------------------------
      # Verify deployment
      # ----------------------------------------------------------

      - name: Verify deployment
        run: |
          echo "=========================================="
          echo "DEPLOYMENT"
          echo "=========================================="

          kubectl get deployment python-app \
            -n default

      # ----------------------------------------------------------
      # Verify service
      # ----------------------------------------------------------

      - name: Verify service
        run: |
          echo "=========================================="
          echo "SERVICE"
          echo "=========================================="

          kubectl get service \
            -n default

      # ----------------------------------------------------------
      # Final result
      # ----------------------------------------------------------

      - name: Deployment summary
        run: |
          echo ""
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "Deployment:"
          kubectl get deployment python-app -n default

          echo ""
          echo "Pods:"
          kubectl get pods -n default

          echo ""
          echo "Service:"
          kubectl get service -n default

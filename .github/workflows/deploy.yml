name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/python-webapp
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: python-app
  K8S_CONTAINER: python-app

jobs:

  # ==========================================================
  # BUILD + PUSH TO DOCKER HUB
  # ==========================================================

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build-image
        run: |

          IMAGE_SHA=$DOCKER_IMAGE:${{ github.sha }}
          IMAGE_LATEST=$DOCKER_IMAGE:latest

          echo "Building:"
          echo "$IMAGE_SHA"

          docker build \
            -t $IMAGE_SHA \
            -t $IMAGE_LATEST \
            .

          echo "Pushing image..."

          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST

          echo "image=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

  # ==========================================================
  # DEPLOY TO KUBERNETES
  # ==========================================================

  deploy:
    name: Deploy to AWS Kubeadm Kubernetes
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Install kubectl
      # ------------------------------------------------------

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # ------------------------------------------------------
      # Configure kubeconfig
      # ------------------------------------------------------

      - name: Configure kubeconfig
        run: |

          mkdir -p $HOME/.kube

          echo "${{ secrets.KUBE_CONFIG }}" \
            | base64 --decode \
            > $HOME/.kube/config

          chmod 600 $HOME/.kube/config

      # ------------------------------------------------------
      # Test Kubernetes connection
      # ------------------------------------------------------

      - name: Test Kubernetes connection
        run: |

          kubectl cluster-info

          echo "================================"
          echo "Kubernetes Nodes"
          echo "================================"

          kubectl get nodes -o wide

      # ------------------------------------------------------
      # Check Kubernetes manifests
      # ------------------------------------------------------

      - name: Validate Kubernetes manifests
        run: |

          kubectl apply \
            --dry-run=client \
            -f k8s/deployment.yaml

          kubectl apply \
            --dry-run=client \
            -f k8s/service.yaml

      # ------------------------------------------------------
      # Deploy manifests
      # ------------------------------------------------------

      - name: Deploy Kubernetes manifests
        run: |

          kubectl apply \
            -f k8s/deployment.yaml \
            -n $K8S_NAMESPACE

          kubectl apply \
            -f k8s/service.yaml \
            -n $K8S_NAMESPACE

      # ------------------------------------------------------
      # Update Docker image
      # ------------------------------------------------------

      - name: Update application image
        env:
          IMAGE: ${{ needs.build.outputs.image }}

        run: |

          echo "Deploying image:"
          echo "$IMAGE"

          kubectl set image \
            deployment/$K8S_DEPLOYMENT \
            $K8S_CONTAINER=$IMAGE \
            -n $K8S_NAMESPACE

      # ------------------------------------------------------
      # Wait for deployment
      # ------------------------------------------------------

      - name: Wait for rollout
        run: |

          kubectl rollout status \
            deployment/$K8S_DEPLOYMENT \
            -n $K8S_NAMESPACE \
            --timeout=300s

      # ------------------------------------------------------
      # Verify
      # ------------------------------------------------------

      - name: Verify deployment
        run: |

          echo "================================"
          echo "Deployment"
          echo "================================"

          kubectl get deployment \
            $K8S_DEPLOYMENT \
            -n $K8S_NAMESPACE

          echo ""
          echo "================================"
          echo "Pods"
          echo "================================"

          kubectl get pods \
            -n $K8S_NAMESPACE \
            -o wide

          echo ""
          echo "================================"
          echo "Services"
          echo "================================"

          kubectl get svc \
            -n $K8S_NAMESPACE

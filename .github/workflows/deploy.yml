name: Build and Deploy Python App to AWS Kubeadm Kubernetes

# ============================================================
# TRIGGERS
# ============================================================

on:

  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:

  # Docker Hub repository
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/python-webapp

  # Kubernetes configuration
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: python-app
  K8S_CONTAINER: python-app


# ============================================================
# JOB 1
# BUILD DOCKER IMAGE AND PUSH TO DOCKER HUB
# ============================================================

jobs:

  build:

    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Display Docker version
      # --------------------------------------------------------

      - name: Check Docker version
        run: |
          docker --version


      # --------------------------------------------------------
      # Login to Docker Hub
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------

      - name: Build Docker image
        id: build-image

        run: |

          echo "=========================================="
          echo "Building Docker Image"
          echo "=========================================="

          IMAGE_SHA="$DOCKER_IMAGE:${{ github.sha }}"

          IMAGE_LATEST="$DOCKER_IMAGE:latest"

          echo "Image SHA:"
          echo "$IMAGE_SHA"

          echo "Image Latest:"
          echo "$IMAGE_LATEST"

          docker build \
            -t "$IMAGE_SHA" \
            -t "$IMAGE_LATEST" \
            .


      # --------------------------------------------------------
      # Push Docker image to Docker Hub
      # --------------------------------------------------------

      - name: Push Docker image to Docker Hub

        run: |

          echo "=========================================="
          echo "Pushing Docker Image"
          echo "=========================================="

          IMAGE_SHA="$DOCKER_IMAGE:${{ github.sha }}"

          IMAGE_LATEST="$DOCKER_IMAGE:latest"

          docker push "$IMAGE_SHA"

          docker push "$IMAGE_LATEST"


      # --------------------------------------------------------
      # Export image name for deployment job
      # --------------------------------------------------------

      - name: Export Docker image

        id: build-image

        run: |

          IMAGE_SHA="$DOCKER_IMAGE:${{ github.sha }}"

          echo "image=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

          echo "Deployment image:"
          echo "$IMAGE_SHA"


# ============================================================
# JOB 2
# DEPLOY TO KUBEADM KUBERNETES
# ============================================================

  deploy:

    name: Deploy to AWS Kubeadm Kubernetes

    runs-on: ubuntu-latest

    needs:
      - build


    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Install kubectl
      # --------------------------------------------------------

      - name: Install kubectl

        uses: azure/setup-kubectl@v4

        with:
          version: latest


      # --------------------------------------------------------
      # Check kubectl
      # --------------------------------------------------------

      - name: Check kubectl version

        run: |

          kubectl version --client


      # --------------------------------------------------------
      # Configure kubeconfig
      # --------------------------------------------------------

      - name: Configure Kubernetes kubeconfig

        run: |

          echo "=========================================="
          echo "Configuring Kubernetes"
          echo "=========================================="

          mkdir -p "$HOME/.kube"

          echo "${{ secrets.KUBE_CONFIG }}" \
            | base64 --decode \
            > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          echo "Kubeconfig created."


      # --------------------------------------------------------
      # Test Kubernetes connection
      # --------------------------------------------------------

      - name: Test Kubernetes connection

        run: |

          echo "=========================================="
          echo "Kubernetes Cluster"
          echo "=========================================="

          kubectl cluster-info

          echo ""

          echo "=========================================="
          echo "Kubernetes Nodes"
          echo "=========================================="

          kubectl get nodes -o wide


      # --------------------------------------------------------
      # Check namespace
      # --------------------------------------------------------

      - name: Check Kubernetes namespace

        run: |

          kubectl get namespace "$K8S_NAMESPACE"


      # --------------------------------------------------------
      # Validate Kubernetes manifests
      # --------------------------------------------------------

      - name: Validate Kubernetes manifests

        run: |

          echo "Validating deployment.yaml"

          kubectl apply \
            --dry-run=client \
            -f k8s/deployment.yaml

          echo "Validating service.yaml"

          kubectl apply \
            --dry-run=client \
            -f k8s/service.yaml


      # --------------------------------------------------------
      # Apply Kubernetes Deployment
      # --------------------------------------------------------

      - name: Apply Kubernetes Deployment

        run: |

          echo "=========================================="
          echo "Applying Deployment"
          echo "=========================================="

          kubectl apply \
            -f k8s/deployment.yaml \
            -n "$K8S_NAMESPACE"


      # --------------------------------------------------------
      # Apply Kubernetes Service
      # --------------------------------------------------------

      - name: Apply Kubernetes Service

        run: |

          echo "=========================================="
          echo "Applying Service"
          echo "=========================================="

          kubectl apply \
            -f k8s/service.yaml \
            -n "$K8S_NAMESPACE"


      # --------------------------------------------------------
      # Update Docker image
      # --------------------------------------------------------

      - name: Update Docker image

        env:

          IMAGE: ${{ needs.build.outputs.image }}

        run: |

          echo "=========================================="
          echo "Updating Kubernetes Image"
          echo "=========================================="

          echo "Deployment:"
          echo "$K8S_DEPLOYMENT"

          echo "Container:"
          echo "$K8S_CONTAINER"

          echo "New Image:"
          echo "$IMAGE"

          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER"="$IMAGE" \
            -n "$K8S_NAMESPACE"


      # --------------------------------------------------------
      # Wait for rollout
      # --------------------------------------------------------

      - name: Wait for Kubernetes rollout

        run: |

          echo "=========================================="
          echo "Waiting for Deployment Rollout"
          echo "=========================================="

          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            --timeout=300s


      # --------------------------------------------------------
      # Verify deployment
      # --------------------------------------------------------

      - name: Verify Kubernetes deployment

        run: |

          echo ""
          echo "=========================================="
          echo "Deployment"
          echo "=========================================="

          kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE"


          echo ""
          echo "=========================================="
          echo "Pods"
          echo "=========================================="

          kubectl get pods \
            -n "$K8S_NAMESPACE" \
            -o wide


          echo ""
          echo "=========================================="
          echo "Services"
          echo "=========================================="

          kubectl get services \
            -n "$K8S_NAMESPACE"


          echo ""
          echo "=========================================="
          echo "Pod Images"
          echo "=========================================="

          kubectl get pods \
            -n "$K8S_NAMESPACE" \
            -o jsonpath="{range .items[*]}{.metadata.name}{': '}{.spec.containers[*].image}{'\n'}{end}"


      # --------------------------------------------------------
      # Describe deployment if required
      # --------------------------------------------------------

      - name: Deployment summary

        run: |

          echo "=========================================="
          echo "Deployment Complete"
          echo "=========================================="

          kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o wide
